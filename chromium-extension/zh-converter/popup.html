<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>簡繁轉換</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; width: 320px; margin: 0; padding: 12px; }
      h1 { margin: 0 0 10px; font-size: 16px; }
      textarea { width: 100%; min-height: 110px; box-sizing: border-box; padding: 8px; resize: vertical; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
      button { border: 0; padding: 8px; border-radius: 8px; cursor: pointer; background: #1f2937; color: #fff; }
      button.secondary { background: #4b5563; }
      .hint { margin-top: 8px; color: #4b5563; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>簡繁中文轉換</h1>
    <textarea id="text" placeholder="在這裡輸入要轉換的文字"></textarea>
    <div class="grid">
      <button id="s2t">輸入 → 繁體</button>
      <button id="t2s">輸入 → 簡體</button>
      <button id="page-s2t" class="secondary">整頁 → 繁體</button>
      <button id="page-t2s" class="secondary">整頁 → 簡體</button>
      <button id="input-s2t" class="secondary">輸入框 → 繁體</button>
      <button id="input-t2s" class="secondary">輸入框 → 簡體</button>
    </div>
    <div id="status" class="hint" aria-live="polite"></div>
    <div class="hint">提示：也可在網頁右鍵使用「選取文字 / 整頁 / 輸入內容」轉換。</div>
    <script src="converter.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
